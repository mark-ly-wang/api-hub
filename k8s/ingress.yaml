apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-hub-ingress
  namespace: api-hub
  annotations:
    # Ingress 类型（根据您的 K8s 集群选择）
    # kubernetes.io/ingress.class: "nginx"  # NGINX Ingress Controller
    # kubernetes.io/ingress.class: "traefik"  # Traefik Ingress Controller

    # 自动生成 TLS 证书（需要安装 cert-manager）
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # NGINX 特定配置（可选）
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # 请求体大小限制
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

    # 超时配置
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"

spec:
  # Ingress 类名（K8s 1.18+）
  ingressClassName: nginx  # 或 traefik，根据您的集群配置

  # TLS 配置
  tls:
  - hosts:
    - api.yourdomain.com  # 替换为您的域名
    secretName: api-hub-tls  # cert-manager 会自动创建此 Secret

  # 路由规则
  rules:
  - host: api.yourdomain.com  # 替换为您的域名
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-hub-service
            port:
              number: 3000

---
# ============================================
# cert-manager ClusterIssuer 配置（可选）
# ============================================
# 如果使用 Let's Encrypt 自动生成 TLS 证书，需要先安装 cert-manager:
# kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.13.0/cert-manager.yaml
#
# 然后创建以下 ClusterIssuer:
# ============================================

