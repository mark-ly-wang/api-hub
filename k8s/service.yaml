apiVersion: v1
kind: Service
metadata:
  name: api-hub-service
  namespace: api-hub
  labels:
    app: api-hub
spec:
  type: ClusterIP  # 集群内部访问，通过 Ingress 暴露到外部
  selector:
    app: api-hub
  ports:
  - name: http
    protocol: TCP
    port: 3000        # Service 端口
    targetPort: 3000  # 容器端口
  sessionAffinity: None  # 不使用会话亲和性
